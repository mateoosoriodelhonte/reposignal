name: Bug report
description: Something in RepoSignal behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        If this involves analyzing a specific repository, include the
        `owner/name` so the behavior can be reproduced against the same data.
      placeholder: |
        1. Analyze `owner/repository`
        2. Open the Issue Health card
        3. ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Screenshots, the incorrect score or finding, and any console or server
        output. Do not paste tokens or credentials.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA you were running.
